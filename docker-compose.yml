version: "3.9"

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn setup.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./:/app
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6378:6379"

  celery:
    build: .
    command: celery -A setup worker --loglevel=info
    volumes:
      - ./:/app
    working_dir: /app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A setup beat --loglevel=info
    volumes:
      - ./:/app
    working_dir: /app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
